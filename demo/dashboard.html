<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard · PostDeploy Analytics</title>
  <meta name="description" content="Private analytics workspace for your websites.">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="demo-strip" role="note">
    <div class="container">
      <p><b>Demo</b> <span class="hide-sm">with sample data for fictional websites.</span> Nothing is collected, sent or deployed.</p>
      <div class="pop" id="demo-pop"></div>
    </div>
  </div>
  <header class="topbar" id="topbar"></header>
  <main id="main" tabindex="-1">
    <div class="container">
      <noscript><div class="notice">This demo runs entirely in your browser and needs JavaScript turned on.</div></noscript>
      <div id="view"></div>
    </div>
  </main>
  <footer class="foot">
    <div class="container">
      <span>PostDeploy Analytics, interactive prototype</span>
      <span>Every figure on these screens is generated sample data.</span>
    </div>
  </footer>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="visually-hidden" id="announce" aria-live="polite"></div>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/privacy.js"></script>
  <script src="js/goals.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
